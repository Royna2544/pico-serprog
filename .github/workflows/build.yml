name: build
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update
      - run: sudo apt-get install -y gcc-arm-none-eabi cmake device-tree-compiler
      - uses: actions/checkout@v3
      - run: git clone -b 1.5.0 https://github.com/raspberrypi/pico-sdk
      - run: cd pico-sdk && git submodule update --init lib/tinyusb
      - run: cmake -DPICO_SDK_PATH=$PWD/pico-sdk -DPICO_STDIO_USB=ON .
      - run: make
      - uses: actions/upload-artifact@v4
        with:
          name: pico_serprog
          path: |
            README.md
            COPYING
            pico_serprog.elf
            pico_serprog.uf2
  mock-network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: sudo apt-get update
      - run: sudo apt-get install -y build-essential cmake ninja-build pkg-config libnm-dev libssl-dev device-tree-compiler python3
      - run: cmake -S . -B build-host -G Ninja -DMOCK_HARDWARE=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo -DMOCK_NETWORK_SANITIZERS=ON
      - run: cmake --build build-host --parallel 2
      - run: ctest --test-dir build-host --output-on-failure
        env:
          UBSAN_OPTIONS: halt_on_error=1
